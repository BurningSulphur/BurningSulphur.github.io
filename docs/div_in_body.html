<!DOCTYPE html>
<html lang="en-gb">

<head>
    <title>Import div testing</title>
    <style>
        .hidden_body {
            margin: 0; /*fixes the div being slightly smaller*/
            background-color: transparent; /*this is the default but I'm making sure that it is*/
        }

        .imported_div {
            background-color: white;
            width: 80%;
            margin: auto;

            box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.12);
            border-radius: 8px;

            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 20px;
            padding-left: 20px;
        }
    </style>
</head>

<body class="hidden_body">
    <div class="imported_div">
        <p>
            just testing if you can import divs
        </p>
    </div>
</body>
